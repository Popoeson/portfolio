<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Popeson</title>

<style>
@font-face{
    font-family: "Avalone";
    src: url("Avalone.ttf");
}

body{
    margin:0;
    height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Avalone, serif;
    overflow:hidden;
    transition:opacity 1.5s ease;
}

body.fade-out{
    opacity:0;
}

.container{
    text-align:center;
}

/* ================= LOGO ================= */

.logo{
    display:flex;
    justify-content:center;
    gap:8px;
    font-size:clamp(120px,10vw,180px); /* bigger, responsive font */
    color:#d4af37;
    letter-spacing:6px;
    position:relative;
}

/* letters fade only, no translateY */
.letter{
    opacity:0;
    transition:opacity .8s ease;
    text-shadow:0 0 8px rgba(212,175,55,.4);
}

.letter.show{
    opacity:1;
}

/* ================= GOLD SWEEP ================= */

.logo::after{
    content:"";
    position:absolute;
    top:0;
    left:-150%;
    width:60%;
    height:100%;
    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,215,120,.85),
        transparent
    );
    transform:skewX(-25deg);
}

.logo.sweep::after{
    animation:sweep 4s linear infinite;
}

@keyframes sweep{
    from{ left:-150%; }
    to{ left:150%; }
}

/* ================= TEXT GLOW PULSE ================= */

.logo.waiting{
    animation:glowPulse 3s ease-in-out infinite;
}

@keyframes glowPulse{
    0%{ text-shadow:0 0 10px rgba(212,175,55,.3); }
    50%{ text-shadow:0 0 35px rgba(212,175,55,.9); }
    100%{ text-shadow:0 0 10px rgba(212,175,55,.3); }
}

/* ================= LOADING BAR ================= */

.loading-container{
    width:100%;
    margin-top:30px;
}

.loading-bar{
    height:3px;
    background:#222;
    overflow:hidden;
}

.progress{
    height:100%;
    width:0%;
    background:#d4af37;
}

/* ================= BUTTON ================= */

.continue-btn{
    margin-top:45px;
    padding:14px 48px;
    border-radius:40px;
    border:1px solid #d4af37;
    background:transparent;
    color:#d4af37;
    font-size:18px;
    letter-spacing:2px;
    cursor:pointer;

    opacity:0;
    transform:scale(.85);
}

/* cinematic appear without moving layout */
.continue-btn.show{
    animation:fadePop 1s ease forwards;
}

@keyframes fadePop{
    0%{ opacity:0; transform:scale(.85); }
    70%{ opacity:1; transform:scale(1.05); }
    100%{ opacity:1; transform:scale(1); }
}

.continue-btn:hover{
    background:#d4af37;
    color:#000;
}

/* button click pulse */
.continue-btn.clicked{
    animation:buttonPulse .6s ease;
}

@keyframes buttonPulse{
    0%{ transform:scale(1); }
    50%{ transform:scale(1.15); background:#d4af37; color:#000; }
    100%{ transform:scale(1); }
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <span class="letter">P</span>
        <span class="letter">O</span>
        <span class="letter">P</span>
        <span class="letter">E</span>
        <span class="letter">S</span>
        <span class="letter">O</span>
        <span class="letter">N</span>
    </div>

    <div class="loading-container">
        <div class="loading-bar">
            <div class="progress"></div>
        </div>
    </div>

    <button class="continue-btn" onclick="goNext()">CONTINUE</button>

</div>

<script>
const letters = document.querySelectorAll(".letter");
const progress = document.querySelector(".progress");
const logo = document.querySelector(".logo");
const button = document.querySelector(".continue-btn");

let width = 0;
let step = 100 / letters.length;
let letterIndex = 0;

/* slower cinematic loading */
let loader = setInterval(()=>{
    width += 0.5; // slow majestic bar
    progress.style.width = width + "%";

    // show letters exactly when bar reaches their position
    if(width >= step * (letterIndex+1) && letterIndex < letters.length){
        letters[letterIndex].classList.add("show");
        letterIndex++;
    }

    if(width >= 100){
        clearInterval(loader);
        setTimeout(()=>{
            logo.classList.add("sweep"); // gold sweep
            logo.classList.add("waiting"); // pulse glow
            button.classList.add("show"); // cinematic button
        },500);
    }

},40);

/* button click */
function goNext(){
    button.classList.add("clicked");
    setTimeout(()=>{
        document.body.classList.add("fade-out");
        setTimeout(()=>{
            window.location.href="home.html";
        },1500);
    },350);
}
</script>

</body>
</html>
