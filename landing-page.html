<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Popeson</title>
<style>
@font-face{
    font-family: "Avalone";
    src: url("Avalone.ttf");
}

body{
    margin:0;
    height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Avalone, serif;
    overflow:hidden;
    transition:opacity 1.5s ease;
}

body.fade-out{
    opacity:0;
}

.container{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:30px;
    max-height:100%;
}

.logo{
    display:flex;
    justify-content:center;
    gap:8px;
    font-size:clamp(120px,10vw,180px); 
    color:#d4af37;
    letter-spacing:6px;
    position:relative;
    overflow: hidden; /* <-- this ensures sweep stays inside logo */
}

.letter{
    opacity:0;
    transition:opacity .3s linear;
    text-shadow:0 0 8px rgba(212,175,55,.4);
}

.letter.show{
    opacity:1;
}

/* ================= CINEMATIC LETTER FADE ================= */
.letter.show{
    opacity:1;
    animation:fadePopLetter 0.8s ease forwards;
}

@keyframes fadePopLetter{
    0% { opacity:0; transform: scale(0.85); }
    70% { opacity:1; transform: scale(1.05); }
    100% { opacity:1; transform: scale(1); }
}

.loading-container{
    width:fit-content;
}

.loading-bar{
    height:3px;
    background:#222;
    overflow:hidden;
}

.progress{
    height:100%;
    width:0%;
    background:#d4af37;
}

.continue-btn{
    padding:14px 48px;
    border-radius:40px;
    border:1px solid #d4af37;
    background:transparent;
    color:#d4af37;
    font-size:18px;
    letter-spacing:2px;
    cursor:pointer;

    opacity:0;
    transform:scale(.85);
}

.continue-btn.show{
    animation:fadePop 1s ease forwards;
}

@keyframes fadePop{
    0%{ opacity:0; transform:scale(.85); }
    70%{ opacity:1; transform:scale(1.05); }
    100%{ opacity:1; transform:scale(1); }
}

.continue-btn:hover{
    background:#d4af37;
    color:#000;
}

.continue-btn.clicked{
    animation:buttonPulse .6s ease;
}

@keyframes buttonPulse{
    0%{ transform:scale(1); }
    50%{ transform:scale(1.15); background:#d4af37; color:#000; }
    100%{ transform:scale(1); }
}

/* ================= GOLD LIGHT SWEEP ================= */
.logo::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 40%;            /* width of the light streak */
    height: 100%;
    background: linear-gradient(
        120deg,
        transparent,
        rgba(255, 215, 120, 0.8),
        transparent
    );
    transform: skewX(-25deg);
    pointer-events: none;  /* allow clicks through */
}

.logo.sweep::after {
    animation:sweep 2s linear forwards;
}

@keyframes sweep {
    from { left: -100%; }
    to { left: 100%; }
}
</style>
</head>
<body>

<div class="container">

    <div class="logo">
        <span class="letter">P</span>
        <span class="letter">O</span>
        <span class="letter">P</span>
        <span class="letter">E</span>
        <span class="letter">S</span>
        <span class="letter">O</span>
        <span class="letter">N</span>
    </div>

    <div class="loading-container">
        <div class="loading-bar">
            <div class="progress"></div>
        </div>
    </div>

    <button class="continue-btn" onclick="goNext()">CONTINUE</button>

</div>

<script>
const letters = document.querySelectorAll(".letter");
const progress = document.querySelector(".progress");
const logo = document.querySelector(".logo");
const button = document.querySelector(".continue-btn");

// make loading bar match logo width
const loadingContainer = document.querySelector('.loading-container');
loadingContainer.style.width = logo.offsetWidth + "px";

let width = 0;
const loaderSpeed = 0.15; // smaller increment = slower bar
const interval = 15;      // slightly slower updates for smooth effect

// Get the left positions of each letter relative to the logo container
const letterPositions = Array.from(letters).map(letter => {
    return letter.offsetLeft + letter.offsetWidth / 2; // center of letter
});
const logoWidth = logo.offsetWidth;

const loader = setInterval(() => {
    width += loaderSpeed;
    if(width > 100) width = 100;

    // set progress width
    progress.style.width = width + "%";

    // convert current progress to pixel position
    const currentPos = (width / 100) * logoWidth;

    // show letters whose position <= current progress
    letters.forEach((letter, index) => {
    if(currentPos >= letterPositions[index]){
        if(!letter.classList.contains("show")){
            // no need for inline transition, animation handles it
            letter.classList.add("show");
        }
    }
});

if(width >= 100){
    clearInterval(loader);
    // start gold sweep first
    logo.classList.add("sweep");

    // show button after sweep finishes
    setTimeout(()=>{
        button.classList.add("show");
    }, 2200); // slightly longer than sweep duration (2s)
}


}, interval);

function goNext(){
    button.classList.add("clicked");
    setTimeout(()=>{
        document.body.classList.add("fade-out");
        setTimeout(()=>{ window.location.href="home.html"; },1500);
    },350);
}
</script>

</body>
</html>
